esphome:
  name: bdr-boiler-ble
  friendly_name: BDR Boiler BLE

external_components:
  - source: github://d-lebed/esphome-bdr-ble
    components: [bdr_ble]

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:

esp32_ble:
  io_capability: keyboard_only

esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:
  - mac_address: "AA:BB:CC:DD:EE:FF"
    id: boiler_ble

bdr_ble:
  id: boiler_hub
  ble_client_id: boiler_ble
  pin: !secret strateo_ble_pin
  node_id: 1
  auth_level: 4

button:
  - platform: bdr_ble
    bdr_ble_id: boiler_hub
    name: "Discover CAN Nodes & Snapshot"

switch:
  - platform: ble_client
    ble_client_id: boiler_ble
    name: "Boiler BLE Connect"
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

sensor:
  # Fast group (polled every 10s in a single GetListRequest batch)
  - platform: bdr_ble
    update_interval: 10s
    sensors:
      - parameter: AM027
        name: "Strateo Outside Temperature"
      - parameter: AM016
        name: "Strateo Flow Temperature"
      - parameter: DM001
        name: "Strateo DHW Temperature"
      - parameter: AM019
        name: "Strateo Water Pressure"

  # Slow group (polled every 60s in a single GetListRequest batch)
  - platform: bdr_ble
    update_interval: 60s
    sensors:
      - parameter: AC005
        name: "Strateo Energy CH Consumption"
      - parameter: AC006
        name: "Strateo Energy DHW Consumption"
      - parameter: AC007
        name: "Strateo Energy Total Consumption"
      - parameter: AC026
        name: "Strateo Energy Backup Consumption"
      - parameter: AC008
        name: "Strateo Energy CH Delivery"
      - parameter: AC009
        name: "Strateo Energy DHW Delivery"
      - parameter: AC019
        name: "Strateo Energy Backup Delivery"
      - parameter: varApTotalEnergyDelivery
        name: "Strateo Energy Total Production"

text_sensor:
  - platform: bdr_ble
    status:
      name: "BLE Status"

binary_sensor:
  - platform: bdr_ble
    update_interval: 10s
    binary_sensors:
      - parameter: HM012
        name: "First stage of backup operation"
      - parameter: HM013
        name: "Second stage of backup operation"

number:
  # Writable numeric parameters (min/max/step are refined from boiler 0x502B descriptors and persisted in flash)
  - platform: bdr_ble
    update_interval: 30s
    numbers:
      - parameter: DP070
        name: "Strateo DHW Comfort Setpoint"
        min_value: 35
        max_value: 65
        step: 0.5
        mode: box
        # device_limits: false  # Optional: keep YAML min/max/step instead of adopting boiler 0x502B limits

select:
  # Writable enum parameters (options auto-populated at compile time and filtered from 0x502B, persisted in flash)
  - platform: bdr_ble
    update_interval: 30s
    selects:
      - parameter: DP200
        name: "Strateo DHW Operating Mode"
        # device_limits: false  # Optional: disable 0x502B option filtering & range guard

